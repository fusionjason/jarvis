[project]
name = "life-insurance-assistant"
version = "0.1.0"
description = "AI assistant that calls and texts life insurance clients, with compliance guardrails"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "twilio==9.4.1",
    "openai==1.59.6",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "websockets==13.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.6", "mypy==1.14.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
